appId: com.novuspos.desktop
# Se mantiene "novus-post" como nombre interno para no cambiar la carpeta
# %APPDATA%\novus-post donde vive novuspos.sqlite. La marca visible es NovusPOS.
productName: novus-post
copyright: Copyright © 2026 NovusPOS
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - '**/*.node'
win:
  executableName: NovusPOS
nsis:
  artifactName: NovusPOS-Setup-${version}-x64.${ext}
  shortcutName: NovusPOS
  uninstallDisplayName: NovusPOS
  menuCategory: NovusPOS
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  # Asistente real (no instalador de un clic) e instalación por usuario:
  # no pide permisos de administrador y permite elegir la carpeta.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # NUNCA borrar los datos: la base SQLite está en %APPDATA%\novus-post.
  deleteAppDataOnUninstall: false
  language: 3082
  installerLanguages:
    - es_ES
  multiLanguageInstaller: false
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: uninstallerSidebar.bmp
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: NovusPOS-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: novuspos
  category: Utility
appImage:
  artifactName: NovusPOS-${version}.${ext}
npmRebuild: false
